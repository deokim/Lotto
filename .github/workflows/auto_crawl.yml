name: Auto Update Lotto

on:
  schedule:
    # 매주 토요일 밤 10시(UTC 기준) 실행
    - cron: '30 14 * * 6'
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0 # 전체 히스토리를 가져와야 rebase 및 push 충돌이 안 납니다.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl

      - name: Run crawler script
        run: python Web_Crawl.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "action@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add lotto_raw.xlsx
          
          # lotto_raw.xlsx 변경 사항이 실제로 존재하는지 체크
          if ! git diff --staged --quiet; then
            git commit -m "Automated Lotto data update"
            git fetch origin main
            git rebase origin/main
            git push origin main
          else
            echo "변경된 내용이 없어 푸시를 스킵합니다."
          fi